<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Turm Delay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="settings" class="hidden">
  <div id="pvBox">
    <div id="pvWrap"><video id="pv" autoplay muted playsinline></video></div>
    <div id="camInfo">Kamera wird gestartet</div>
  </div>
  <div id="panel">
    <div class="grp">
      <label>Kamera</label>
      <div class="seg" id="segFacing">
        <button data-v="environment">Rückkamera</button>
        <button data-v="user">Frontkamera</button>
      </div>
    </div>
    <div class="grp">
      <label>Spiegeln</label>
      <div class="seg" id="segMirror">
        <button data-v="0">Aus</button>
        <button data-v="1">Ein</button>
      </div>
    </div>
    <div class="grp">
      <label><span>Zoom</span><span id="zoomVal"></span></label>
      <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">
    </div>
    <div class="grp" id="expGrp">
      <label>Belichtungszeit</label>
      <div class="seg" id="segExp">
        <button data-v="auto">Auto</button>
        <button data-v="100">1/100</button>
        <button data-v="40">1/250</button>
        <button data-v="20">1/500</button>
      </div>
    </div>
    <div class="grp" id="isoGrp">
      <label><span>Helligkeit ISO</span><span id="isoVal"></span></label>
      <input type="range" id="iso" min="50" max="1000" step="10" value="400">
    </div>
    <div class="grp">
      <label>Auflösung</label>
      <div class="seg" id="segRes">
        <button data-v="720">720p</button>
        <button data-v="1080">1080p</button>
      </div>
    </div>
    <div class="grp">
      <label>Bilder pro Sekunde</label>
      <div class="seg" id="segFps">
        <button data-v="25">25</button>
        <button data-v="30">30</button>
      </div>
    </div>
    <div class="grp">
      <label><span>Verzögerung</span><span id="delayVal"></span></label>
      <div class="delayRow">
        <button id="delayMinus">−</button>
        <input type="range" id="delay" min="1" max="30" step="1" value="20">
        <button id="delayPlus">+</button>
      </div>
    </div>
    <button id="start">Start</button>
    <p class="hint">Im Betrieb 3 Sekunden an beliebiger Stelle gedrückt halten, um hierher zurückzukehren. <span id="version"></span></p>
  </div>
</div>

<div id="run" class="hidden">
  <div id="stage">
    <canvas id="out"></canvas>
    <div id="badge"></div>
  </div>
  <svg id="ring" class="hidden" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50"/></svg>
</div>

<script src="app.js"></script>
</body>
</html>
