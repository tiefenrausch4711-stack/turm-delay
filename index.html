<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<title>LagLab</title>
<link rel="icon" href="app/icon-192.png">
<style>
  :root { --bg: #0b0d0f; --surface: #1c2228; --line: #2f363e; --fg: #e9edf0; --mut: #8a949e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, Roboto, sans-serif;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mut); }
  h1 b { color: var(--fg); margin-left: 0.35em; }
  .apps { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  a {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    width: 220px; padding: 28px 20px 22px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-size: 18px; font-weight: 600;
  }
  a:active { transform: scale(0.98); }
  a img { width: 112px; height: 112px; border-radius: 24px; }
  p { margin: 0; max-width: 520px; text-align: center; color: var(--mut); font-size: 14px; }
</style>
</head>
<body>
  <h1>Lag<b>Lab</b></h1>
  <div class="apps">
    <a href="app/"><img src="app/icon-192.png" alt="">LagLab</a>
    <a href="test/"><img src="test/icon-192.png" alt="">LagLab Test</a>
  </div>
  <p>App öffnen und im Chrome-Menü oben rechts „App installieren“ wählen.</p>
<script>
  // Alten Service Worker der früher hier liegenden App abmelden. Die Worker unter app/ und test/ bleiben.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      const here = new URL('./', location.href).href;
      for (const r of regs) if (r.scope === here) r.unregister();
    }).catch(() => {});
  }
</script>
</body>
</html>
