<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<title>LagLab Test</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Eigener Startbildschirm, schließt nahtlos an den von Android an -->
<div id="splash"><img src="icon-512.png" alt=""></div>

<div id="settings" class="hidden">
  <header class="bar">
    <div class="mark"><span class="glyph"></span>Lag<b>Lab</b><span class="tag">Test</span></div>
    <nav class="tabs"><button data-tab="live" class="on">Live</button><button data-tab="analyse">Analyse</button></nav>
    <div class="barR"><div class="meta" id="version"></div><button class="gear" data-ui aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.4" stroke-width="3.6" stroke-dasharray="3.2 3.4"/><circle cx="12" cy="12" r="6" stroke-width="3"/></svg></button></div>
  </header>

  <main class="left">
    <div id="pvWrap">
      <video id="pv" autoplay muted playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
      <div class="thirds"></div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="hud top"><span id="hudState" class="state"><span class="dot"></span><span id="hudStateTxt">Start</span></span><span id="hudCam"></span></div>
      <div class="hud bottom"><span id="hudRes">–</span><span id="hudExp"></span><span id="hudFocus"></span><span id="hudFps">–</span></div>
      <div id="camMsg" class="hidden"></div>
    </div>

    <section class="delay">
      <div class="label"><span class="no">01</span>Verzögerung</div>
      <div class="delayRow">
        <button id="delayMinus" class="step" aria-label="Eine Sekunde weniger">−</button>
        <div class="readout"><span id="delayVal">20</span><small>s</small></div>
        <button id="delayPlus" class="step" aria-label="Eine Sekunde mehr">+</button>
      </div>
      <div class="scale">
        <input type="range" id="delay" min="1" max="30" step="1" value="20">
        <div class="ticks" id="delayTicks"></div>
      </div>
    </section>
  </main>

  <aside id="panel">
    <div class="grp">
      <div class="label"><span class="no">02</span>Kamera</div>
      <div class="seg" id="segFacing">
        <button data-v="environment">Rückseite</button>
        <button data-v="user">Vorderseite</button>
        <button data-v="external">USB</button>
      </div>
    </div>

    <div class="grp">
      <div class="label"><span class="no">03</span>Zoom</div>
      <div class="row">
        <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">
        <span class="val" id="zoomVal">1,0×</span>
      </div>
    </div>

    <div class="grp" id="expGrp">
      <div class="label"><span class="no">04</span>Belichtung</div>
      <div class="seg" id="segExp">
        <button data-v="auto">Auto</button>
        <button data-v="manual">Manuell</button>
      </div>
      <div class="row" id="evGrp">
        <span class="lum dark"></span>
        <input type="range" id="ev" min="0" max="1000" step="1" value="600" aria-label="Helligkeit">
        <span class="lum bright"></span>
      </div>
    </div>

    <div class="grp" id="focusGrp">
      <div class="label"><span class="no">05</span>Fokus</div>
      <div class="seg" id="segFocus">
        <button data-v="auto">Auto</button>
        <button data-v="manual">Manuell</button>
      </div>
      <div class="row" id="fdGrp">
        <span class="end">nah</span>
        <input type="range" id="fd" min="0" max="1000" step="1" value="1000" aria-label="Fokusabstand">
        <span class="end">fern</span>
      </div>
    </div>

    <div class="actions">
      <button id="start"><span class="go">Start</span></button>
    </div>
  </aside>
</div>

<div id="run" class="hidden">
  <div id="stage">
    <canvas id="out"></canvas>
    <div id="badge"></div>
    <button id="saveBtn" aria-label="Video speichern"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle class="prog" cx="60" cy="60" r="50"/></svg></button>
    <div id="toast" class="hidden"></div>
  </div>
  <svg id="ring" class="hidden" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle class="prog" cx="60" cy="60" r="50"/></svg>
</div>

<div id="analysis" class="hidden">
  <section id="aList">
    <header class="bar">
      <div class="mark"><span class="glyph"></span>Lag<b>Lab</b><span class="tag">Test</span></div>
      <nav class="tabs"><button data-tab="live">Live</button><button data-tab="analyse" class="on">Analyse</button></nav>
      <div class="barR"><button class="gear" data-ui aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.4" stroke-width="3.6" stroke-dasharray="3.2 3.4"/><circle cx="12" cy="12" r="6" stroke-width="3"/></svg></button></div>
    </header>
    <div class="filters">
      <nav class="tabs" id="fKind"><button data-k="videos" class="on">Videos</button><button data-k="images">Bilder</button></nav>
      <button id="fStar" class="chip" aria-label="Nur mit Stern">★</button>
      <select id="fName" aria-label="Name"></select>
      <select id="fProp" aria-label="Eigenschaft"></select>
    </div>
    <div id="aGrid"></div>
    <p id="aEmpty" class="hidden"></p>
  </section>

  <section id="aPlayer" class="hidden">
    <header class="pbar">
      <div class="pL">
        <button id="pBack" class="nav">‹ Übersicht</button>
        <div id="pTitle"></div>
      </div>
      <nav class="tabs" id="pKind"><button data-pk="video" class="on">Video</button><button data-pk="images">Bilder</button></nav>
      <div class="pR">
        <button id="pStar" class="star" aria-label="Stern">☆</button>
        <input id="pName" list="pNames" placeholder="Name" autocomplete="off" enterkeyhint="done">
        <input id="pProp" list="pProps" placeholder="Eigenschaft" autocomplete="off" enterkeyhint="done">
        <datalist id="pNames"></datalist>
        <datalist id="pProps"></datalist>
        <button id="pDown" class="tool icon" aria-label="Herunterladen" title="Herunterladen"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
        <button id="pDel" class="tool danger">Löschen</button>
      </div>
    </header>
    <div id="pMain">
      <div id="pStage"><div id="pView"><canvas id="pOut"></canvas><canvas id="pDraw"></canvas></div><div id="pStill" class="hidden"></div><div id="pMsg" class="hidden"></div>
        <div class="clipNav">
          <button id="pPrevClip" class="navArrow" aria-label="Zurück">‹</button>
          <button id="pNextClip" class="navArrow" aria-label="Weiter">›</button>
        </div>
      </div>
      <nav id="pTools">
        <button class="tl on" data-tool="view"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5"/></svg><span>Zoom</span></button>
        <button class="tl" id="dZoom"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>1:1</span></button>
        <button class="tl" data-tool="free"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg><span>Stift</span></button>
        <button class="tl" data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/></svg><span>Linie</span></button>
        <button class="tl" data-tool="angle"><svg viewBox="0 0 24 24"><path d="M20 19H5L15 5"/><path d="M10 19a5 5 0 0 0-2-4"/></svg><span>Winkel</span></button>
        <button class="tl" data-tool="plumb"><svg viewBox="0 0 24 24"><path d="M12 3v13" stroke-dasharray="2.6 2.6"/><path d="M9 16h6l-3 5z"/></svg><span>Lot</span></button>
        <button class="tl" id="dColor"><i class="dot"></i><span>Farbe</span></button>
        <button class="tl" id="dCut"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8.2 8.4L20 17M8.2 15.6L20 7"/></svg><span>Schneiden</span></button>
        <button class="tl" id="dStrobe"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="17" r="2.3" opacity=".45"/><circle cx="11" cy="11" r="2.3" opacity=".7"/><circle cx="17.5" cy="6.5" r="2.3"/></svg><span>Bildfolge</span></button>
        <button class="tl" id="dUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Rückgängig</span></button>
        <button class="tl" id="dClear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Leeren</span></button>
        <button class="tl" id="dSave"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Speichern</span></button>
      </nav>
    </div>
    <div id="pRange" class="hidden">
      <span id="rgInfo"></span>
      <div class="rgCount" id="rgCountBox">
        <button id="rgMinus" class="step sm" aria-label="Weniger Bilder">−</button>
        <span id="rgCount">8</span><small>Bilder</small>
        <button id="rgPlus" class="step sm" aria-label="Mehr Bilder">+</button>
      </div>
      <button id="rgCancel" class="tool">Abbrechen</button>
      <button id="rgOk" class="tool ok">Schneiden</button>
    </div>
    <footer class="pctl">
      <button id="pPrev" class="ico" aria-label="Ein Bild zurück"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9.5 12z"/></svg></button>
      <button id="pPlay" class="ico big" aria-label="Abspielen"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg></button>
      <button id="pNext" class="ico" aria-label="Ein Bild vor"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l9.5-7z"/></svg></button>
      <div class="seekWrap"><div id="pSel" class="hidden"></div><i id="hA" class="hd a hidden"></i><i id="hB" class="hd b hidden"></i><input type="range" id="pSeek" min="0" max="0" step="1" value="0" aria-label="Position"></div>
      <span id="pTime"></span>
      <div class="seg" id="pSpeed">
        <button data-v="1">1×</button>
        <button data-v="0.5">½</button>
        <button data-v="0.25">¼</button>
        <button data-v="0.125">⅛</button>
      </div>
    </footer>
  </section>
</div>

<div id="uiDlg" class="hidden">
  <div class="dlg" role="dialog" aria-label="Einstellungen">
    <div id="uiMain">
      <h2>Einstellungen</h2>
      <div class="label"><span class="no">01</span>Farbe</div>
      <div class="swatches" id="swatches">
        <button class="sw custom" id="accCustom" aria-label="Farbe frei wählen"></button>
        <button class="sw saved" id="accSaved" aria-label="Eigene Farbe"></button>
      </div>
      <div class="label"><span class="no">02</span>Modus</div>
      <div class="seg" id="segTheme">
        <button data-v="dark">Dunkel</button>
        <button data-v="light">Hell</button>
      </div>
      <div class="label"><span class="no">03</span>Größe</div>
      <div class="seg" id="segSize">
        <button data-v="0">Normal</button>
        <button data-v="1">Groß</button>
        <button data-v="2">Sehr groß</button>
      </div>
      <div class="label"><span class="no">04</span>Videos</div>
      <div class="vidGrid">
        <span id="keepLabel" class="vidText">Videos ohne Stern löschen nach</span>
        <div class="keepCtl">
          <button id="keepMinus" class="step xs" aria-label="Ein Tag weniger">−</button>
          <b id="keepDays"></b>
          <button id="keepPlus" class="step xs" aria-label="Ein Tag mehr">+</button>
        </div>
        <span id="uiStore" class="vidText"></span>
        <button id="delOpen" class="tool danger">Videos löschen …</button>
      </div>
    </div>
    <div id="uiDel" class="hidden">
      <h2>Videos löschen</h2>
      <div id="delChoose" class="delStep">
        <p class="delText">Welche Videos sollen gelöscht werden?</p>
        <button id="delNoStar" class="tool">Ohne Stern löschen</button>
        <button id="delAll" class="tool">Alle löschen</button>
        <button id="delCancel" class="tool">Abbrechen</button>
      </div>
      <div id="delAsk" class="delStep hidden">
        <p class="delText" id="delQuestion"></p>
        <button id="delYes" class="tool delAll">Ja, löschen</button>
        <button id="delNo" class="tool">Abbrechen</button>
      </div>
    </div>
    <div id="uiPick" class="hidden">
      <h2>Eigene Farbe</h2>
      <div class="sv" id="pickSv"><i class="knob" id="pickSvKnob"></i></div>
      <div class="hue" id="pickHue"><i class="knob" id="pickHueKnob"></i></div>
      <div class="pickRow"><i class="pickPrev" id="pickPrev"></i><span id="pickHex"></span></div>
      <button id="pickDone" class="dlgBtn">Übernehmen</button>
    </div>
  </div>
</div>

<script src="native.js"></script>
<script src="app.js"></script>
<script src="analysis.js"></script>
<script src="draw.js"></script>
</body>
</html>
