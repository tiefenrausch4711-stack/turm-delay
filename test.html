<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turm Delay Test</title>
<style>
  :root { --bg:#111; --fg:#eee; --ok:#4d4; --warn:#fc3; --bad:#f66; --mut:#999; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.35 system-ui, sans-serif; padding:16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  h2 { font-size:19px; margin:14px 0 4px; padding-bottom:2px; border-bottom:1px solid #444; }
  button { font-size:20px; padding:12px 22px; margin:4px 8px 4px 0; border-radius:8px; border:0; background:#2a7; color:#fff; }
  button:disabled { background:#555; }
  #status { font-size:18px; color:var(--warn); margin:8px 0; min-height:1.4em; }
  #media { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  #media video, #media canvas { width:360px; max-width:100%; aspect-ratio:16/9; background:#000; }
  #out { columns:2 460px; column-gap:28px; }
  section { break-inside:avoid; }
  .row { display:flex; gap:10px; padding:1px 0; border-bottom:1px solid #222; }
  .k { flex:0 0 44%; color:#bbb; }
  .v { flex:1; word-break:break-word; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .mut { color:var(--mut); }
</style>
</head>
<body>
<h1>Turm Delay Testseite</h1>
<div>
  <button id="start">Test starten</button>
  <button id="copy" disabled>Ergebnis kopieren</button>
</div>
<div id="status">Dauer etwa 2 Minuten. Tablet dabei ruhig liegen lassen.</div>
<div id="media">
  <video id="preview" autoplay muted playsinline></video>
  <canvas id="decoded"></canvas>
</div>
<div id="out"></div>

<script>
'use strict';

const out = document.getElementById('out');
const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
const decodedCanvas = document.getElementById('decoded');
let section = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = t => { statusEl.textContent = t; };
const r1 = x => Math.round(x * 10) / 10;

function sec(title) {
  section = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = title;
  section.append(h);
  out.append(section);
}

function row(k, v, cls = '') {
  const d = document.createElement('div');
  d.className = 'row';
  const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
  const b = document.createElement('span'); b.className = 'v ' + cls; b.textContent = v;
  d.append(a, b);
  section.append(d);
  return b;
}

const yn = (k, b) => row(k, b ? 'ja' : 'nein', b ? 'ok' : 'bad');

function fmtCap(v) {
  if (Array.isArray(v)) return v.join(', ') || 'leer';
  if (v && typeof v === 'object' && 'max' in v) {
    let s = `${r1(v.min)} bis ${r1(v.max)}`;
    if (v.step) s += ` Schritt ${r1(v.step)}`;
    return s;
  }
  return String(v);
}

// H.264 Constrained Baseline mit passendem Level für Auflösung und Bildrate
function avcCodec(w, h, fps) {
  const fs = Math.ceil(w / 16) * Math.ceil(h / 16);
  const mbps = fs * fps;
  let lvl = '33';
  if (fs <= 3600 && mbps <= 108000) lvl = '1F';
  else if (fs <= 5120 && mbps <= 216000) lvl = '20';
  else if (fs <= 8192 && mbps <= 245760) lvl = '28';
  else if (fs <= 8704 && mbps <= 522240) lvl = '2A';
  return 'avc1.42E0' + lvl;
}

const MODES = [
  { name: '720p30', w: 1280, h: 720, fps: 30 },
  { name: '720p60', w: 1280, h: 720, fps: 60 },
  { name: '1080p30', w: 1920, h: 1080, fps: 30 },
  { name: '1080p60', w: 1920, h: 1080, fps: 60 },
];
const CAMS = [
  { name: 'Rückkamera', facing: 'environment' },
  { name: 'Frontkamera', facing: 'user' },
];

function openCam(facing, w, h, fps, extra = {}) {
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { exact: facing }, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps }, ...extra },
  });
}

async function closeCam(stream) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  preview.srcObject = null;
  await sleep(400);
}

function readTimeout(reader, ms) {
  return Promise.race([reader.read(), sleep(ms).then(() => null)]);
}

// Misst die tatsächlich gelieferte Bildrate anhand der Kamerazeitstempel
async function measureFps(track, ms) {
  if ('MediaStreamTrackProcessor' in window) {
    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    const warmupEnd = performance.now() + 500;
    let n = 0, t0 = null, tl = null;
    const end = warmupEnd + ms;
    while (performance.now() < end) {
      const r = await readTimeout(reader, 2000);
      if (!r || r.done) break;
      const ts = r.value.timestamp;
      r.value.close();
      if (performance.now() < warmupEnd) continue;
      if (t0 === null) t0 = ts; else { n++; tl = ts; }
    }
    reader.cancel().catch(() => {});
    return tl === null ? 0 : n / ((tl - t0) / 1e6);
  }
  // Rückfall über requestVideoFrameCallback
  preview.srcObject = new MediaStream([track]);
  await preview.play().catch(() => {});
  await sleep(500);
  return new Promise(resolve => {
    let n = 0, t0 = null, tl = null;
    const end = performance.now() + ms;
    const cb = (now, meta) => {
      if (t0 === null) t0 = meta.mediaTime; else { n++; tl = meta.mediaTime; }
      if (performance.now() < end) preview.requestVideoFrameCallback(cb);
      else resolve(tl === null ? 0 : n / (tl - t0));
    };
    preview.requestVideoFrameCallback(cb);
  });
}

async function testBasics() {
  sec('Grundlagen');
  let chrome = navigator.userAgent.match(/Chrome\/([\d.]+)/)?.[1] || 'unbekannt';
  let model = '';
  try {
    const hv = await navigator.userAgentData.getHighEntropyValues(['fullVersionList', 'model', 'platformVersion']);
    chrome = hv.fullVersionList.find(b => b.brand === 'Google Chrome' || b.brand === 'Chromium')?.version || chrome;
    model = `${hv.model}, Android ${hv.platformVersion}`;
  } catch (e) {}
  row('Chrome', chrome);
  if (model) row('Gerät', model);
  row('Bildschirm', `${screen.width} x ${screen.height}, Pixeldichte ${devicePixelRatio}`);
  row('Arbeitsspeicher laut Browser', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unbekannt');
  row('Prozessorkerne', String(navigator.hardwareConcurrency || 'unbekannt'));
  yn('Sicherer Kontext', window.isSecureContext);
  yn('getUserMedia', !!navigator.mediaDevices?.getUserMedia);
  yn('VideoEncoder', 'VideoEncoder' in window);
  yn('VideoDecoder', 'VideoDecoder' in window);
  yn('MediaStreamTrackProcessor', 'MediaStreamTrackProcessor' in window);
  yn('requestVideoFrameCallback', 'requestVideoFrameCallback' in HTMLVideoElement.prototype);
  yn('OffscreenCanvas', 'OffscreenCanvas' in window);
  yn('Service Worker', 'serviceWorker' in navigator);
  const wl = row('Wake Lock', 'wird geprüft');
  try {
    const lock = await navigator.wakeLock.request('screen');
    wl.textContent = 'ja, Sperre erhalten';
    wl.className = 'v ok';
    await lock.release();
  } catch (e) {
    wl.textContent = 'nein, ' + e.name;
    wl.className = 'v bad';
  }
}

async function testCodecSupport() {
  sec('WebCodecs H.264 Unterstützung');
  if (!('VideoEncoder' in window)) { row('WebCodecs', 'fehlt', 'bad'); return; }
  for (const m of MODES) {
    const codec = avcCodec(m.w, m.h, m.fps);
    const res = [];
    for (const hw of ['prefer-hardware', 'prefer-software']) {
      let e = false, d = false;
      try {
        e = (await VideoEncoder.isConfigSupported({ codec, width: m.w, height: m.h, framerate: m.fps, bitrate: 6e6, hardwareAcceleration: hw })).supported;
      } catch (x) {}
      try {
        d = (await VideoDecoder.isConfigSupported({ codec, codedWidth: m.w, codedHeight: m.h, hardwareAcceleration: hw })).supported;
      } catch (x) {}
      res.push({ hw, e, d });
    }
    const h = res[0], s = res[1];
    const txt = `Hardware Enc ${h.e ? 'ja' : 'nein'} Dec ${h.d ? 'ja' : 'nein'}, Software Enc ${s.e ? 'ja' : 'nein'} Dec ${s.d ? 'ja' : 'nein'}`;
    row(m.name, txt, h.e && h.d ? 'ok' : (s.e && s.d ? 'warn' : 'bad'));
  }
}

async function testCamera(cam) {
  sec(cam.name);
  let stream;
  // Fähigkeiten, zoom: true fordert die Zoom-Berechtigung in Chrome an
  try {
    try { stream = await openCam(cam.facing, 1280, 720, 30, { zoom: true }); }
    catch (e) { stream = await openCam(cam.facing, 1280, 720, 30); }
  } catch (e) {
    row('Zugriff', 'fehlgeschlagen, ' + e.name, 'bad');
    return;
  }
  row('Zugriff', 'ja', 'ok');
  preview.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  for (const k of ['width', 'height', 'frameRate', 'zoom', 'exposureMode', 'exposureTime', 'exposureCompensation', 'iso', 'focusMode', 'focusDistance', 'whiteBalanceMode', 'torch']) {
    if (k in caps) row(k, fmtCap(caps[k]));
    else if (['zoom', 'exposureMode', 'exposureTime', 'focusMode'].includes(k)) row(k, 'nicht gemeldet', 'mut');
  }

  if (caps.zoom) {
    status(`${cam.name}: Zoom wird getestet`);
    const target = Math.min(caps.zoom.max, 2);
    try {
      await track.applyConstraints({ advanced: [{ zoom: target }] });
      await sleep(1200);
      const got = track.getSettings().zoom;
      row('Zoom Test', `${target} angefordert, ${got} gemeldet`, Math.abs(got - target) < 0.05 ? 'ok' : 'warn');
      await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
    } catch (e) {
      row('Zoom Test', 'fehlgeschlagen, ' + e.name, 'bad');
    }
  }

  if (caps.exposureMode?.includes('manual') && caps.exposureTime) {
    status(`${cam.name}: Belichtungszeit wird getestet, das Bild wird kurz dunkler`);
    // Einheit in Chrome ist 100 Mikrosekunden, 20 entspricht 1/500 s
    const target = Math.max(caps.exposureTime.min, 20);
    try {
      await track.applyConstraints({ advanced: [{ exposureMode: 'manual', exposureTime: target }] });
      await sleep(1500);
      const got = track.getSettings().exposureTime;
      row('Belichtung Test', `${target} angefordert, ${got} gemeldet`, Math.abs(got - target) < 1 ? 'ok' : 'warn');
      await track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] });
    } catch (e) {
      row('Belichtung Test', 'fehlgeschlagen, ' + e.name, 'bad');
    }
  }
  await closeCam(stream);

  for (const m of MODES) {
    status(`${cam.name}: ${m.name} wird gemessen`);
    try {
      stream = await openCam(cam.facing, m.w, m.h, m.fps);
      preview.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      const s = track.getSettings();
      const fps = await measureFps(track, 2500);
      const resOk = s.width === m.w && s.height === m.h;
      const fpsOk = fps >= m.fps * 0.9;
      row(m.name, `${s.width} x ${s.height}, gemeldet ${r1(s.frameRate)}, gemessen ${r1(fps)} B/s`,
        resOk && fpsOk ? 'ok' : (fps > 0 ? 'warn' : 'bad'));
    } catch (e) {
      row(m.name, 'fehlgeschlagen, ' + e.name, 'bad');
    }
    await closeCam(stream);
    stream = null;
  }
}

// Kamera aufnehmen, kodieren, sofort wieder dekodieren und zeichnen
async function loadTest(m, seconds) {
  let stream;
  try { stream = await openCam('environment', m.w, m.h, m.fps); }
  catch (e) { row(m.name, 'Kamera fehlgeschlagen, ' + e.name, 'bad'); return; }
  preview.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  const s = track.getSettings();
  const fps = s.frameRate || m.fps;
  const codec = avcCodec(s.width, s.height, Math.round(fps));
  const bitrate = s.height >= 1080 ? 8e6 : 5e6;

  let hw = 'prefer-hardware';
  try {
    const sup = await VideoEncoder.isConfigSupported({ codec, width: s.width, height: s.height, framerate: fps, bitrate, hardwareAcceleration: hw });
    if (!sup.supported) hw = 'no-preference';
  } catch (e) { hw = 'no-preference'; }

  decodedCanvas.width = s.width;
  decodedCanvas.height = s.height;
  const ctx = decodedCanvas.getContext('2d');
  const errors = [];
  const sentAt = new Map();
  let camFrames = 0, enc = 0, dec = 0, drop = 0, bytes = 0, maxEQ = 0, maxDQ = 0, latSum = 0, latMax = 0;
  let decoderReady = false;

  const decoder = new VideoDecoder({
    output: f => {
      dec++;
      const t = sentAt.get(f.timestamp);
      if (t !== undefined) {
        const lat = performance.now() - t;
        latSum += lat;
        if (lat > latMax) latMax = lat;
        sentAt.delete(f.timestamp);
      }
      ctx.drawImage(f, 0, 0, decodedCanvas.width, decodedCanvas.height);
      f.close();
    },
    error: e => errors.push('Decoder ' + e.message),
  });
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      enc++;
      bytes += chunk.byteLength;
      if (!decoderReady && meta?.decoderConfig) {
        decoder.configure({ ...meta.decoderConfig, hardwareAcceleration: hw });
        decoderReady = true;
      }
      if (decoderReady && decoder.state === 'configured') {
        decoder.decode(chunk);
        if (decoder.decodeQueueSize > maxDQ) maxDQ = decoder.decodeQueueSize;
      }
    },
    error: e => errors.push('Encoder ' + e.message),
  });

  try {
    encoder.configure({ codec, width: s.width, height: s.height, bitrate, framerate: fps, hardwareAcceleration: hw, latencyMode: 'realtime', avc: { format: 'avc' } });
  } catch (e) {
    row(m.name, 'Encoder nicht konfigurierbar, ' + e.message, 'bad');
    await closeCam(stream);
    return;
  }

  const keyInt = Math.round(fps);
  const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
  const t0 = performance.now();
  while (performance.now() - t0 < seconds * 1000 && encoder.state === 'configured') {
    const r = await readTimeout(reader, 2000);
    if (!r || r.done) { errors.push('keine Kamerabilder'); break; }
    const f = r.value;
    camFrames++;
    if (encoder.encodeQueueSize > 4) { drop++; f.close(); continue; }
    sentAt.set(f.timestamp, performance.now());
    encoder.encode(f, { keyFrame: camFrames % keyInt === 1 });
    f.close();
    if (encoder.encodeQueueSize > maxEQ) maxEQ = encoder.encodeQueueSize;
  }
  const elapsed = (performance.now() - t0) / 1000;
  reader.cancel().catch(() => {});
  try { await encoder.flush(); } catch (e) {}
  try { if (decoder.state === 'configured') await decoder.flush(); } catch (e) {}
  try { encoder.close(); } catch (e) {}
  try { decoder.close(); } catch (e) {}
  await closeCam(stream);

  const camFps = camFrames / elapsed, encFps = enc / elapsed, decFps = dec / elapsed;
  const mbit = bytes * 8 / elapsed / 1e6;
  const ok = errors.length === 0 && drop === 0 && decFps >= camFps * 0.95 && camFps >= m.fps * 0.9;
  const hwTxt = hw === 'prefer-hardware' ? 'Hardware' : 'ohne Vorgabe';
  row(m.name, `${s.width} x ${s.height} ${hwTxt}, Kamera ${r1(camFps)}, kodiert ${r1(encFps)}, dekodiert ${r1(decFps)} B/s, verworfen ${drop}, ${r1(mbit)} Mbit/s, Latenz Ø ${Math.round(dec ? latSum / dec : 0)} ms max ${Math.round(latMax)} ms, Warteschlange max ${maxEQ}/${maxDQ}`
    + (errors.length ? ', Fehler ' + errors[0] : ''),
    ok ? 'ok' : (dec > 0 ? 'warn' : 'bad'));
}

async function testLoad() {
  sec('Lasttest Rückkamera, je 10 Sekunden');
  if (!('VideoEncoder' in window) || !('MediaStreamTrackProcessor' in window)) {
    row('Lasttest', 'nicht möglich, WebCodecs oder MediaStreamTrackProcessor fehlt', 'bad');
    return;
  }
  for (const m of MODES) {
    status(`Lasttest ${m.name} läuft`);
    try { await loadTest(m, 10); }
    catch (e) { row(m.name, 'Abbruch, ' + e.message, 'bad'); }
  }
}

// Rückfallweg, JPEG-Kompression von 720p Bildern
async function testJpeg() {
  sec('Rückfallweg JPEG 720p, 5 Sekunden');
  if (!('OffscreenCanvas' in window) || !('MediaStreamTrackProcessor' in window)) {
    row('JPEG', 'nicht geprüft, OffscreenCanvas oder MediaStreamTrackProcessor fehlt', 'mut');
    return;
  }
  status('JPEG Test läuft');
  let stream;
  try { stream = await openCam('environment', 1280, 720, 60); }
  catch (e) { row('JPEG', 'Kamera fehlgeschlagen, ' + e.name, 'bad'); return; }
  preview.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  const s = track.getSettings();
  const oc = new OffscreenCanvas(s.width, s.height);
  const octx = oc.getContext('2d');
  const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
  const blobs = [];
  let camFrames = 0, busy = false, bytes = 0;
  const t0 = performance.now();
  while (performance.now() - t0 < 5000) {
    const r = await readTimeout(reader, 2000);
    if (!r || r.done) break;
    camFrames++;
    if (busy) { r.value.close(); continue; }
    octx.drawImage(r.value, 0, 0);
    r.value.close();
    busy = true;
    oc.convertToBlob({ type: 'image/jpeg', quality: 0.7 }).then(b => {
      blobs.push(b);
      bytes += b.size;
      busy = false;
    });
  }
  const elapsed = (performance.now() - t0) / 1000;
  reader.cancel().catch(() => {});
  await closeCam(stream);
  while (busy) await sleep(20);

  const jpegFps = blobs.length / elapsed;
  const avgKB = blobs.length ? bytes / blobs.length / 1024 : 0;
  row('Kodierung', `Kamera ${r1(camFrames / elapsed)} B/s, JPEG ${r1(jpegFps)} B/s, Ø ${Math.round(avgKB)} KB pro Bild`,
    jpegFps >= 55 ? 'ok' : (jpegFps >= 28 ? 'warn' : 'bad'));
  row('Speicher für 30 s', `bei 60 B/s ${Math.round(avgKB * 1800 / 1024)} MB, bei 30 B/s ${Math.round(avgKB * 900 / 1024)} MB`);

  const t1 = performance.now();
  let n = 0;
  const ctx = decodedCanvas.getContext('2d');
  decodedCanvas.width = s.width;
  decodedCanvas.height = s.height;
  for (const b of blobs) {
    const bmp = await createImageBitmap(b);
    ctx.drawImage(bmp, 0, 0);
    bmp.close();
    n++;
  }
  const decFps = n / ((performance.now() - t1) / 1000);
  row('Dekodierung', `${r1(decFps)} B/s`, decFps >= 60 ? 'ok' : (decFps >= 30 ? 'warn' : 'bad'));
}

document.getElementById('start').onclick = async () => {
  const btn = document.getElementById('start');
  btn.disabled = true;
  out.textContent = '';
  const t0 = performance.now();
  try {
    await testBasics();
    await testCodecSupport();
    for (const cam of CAMS) await testCamera(cam);
    await testLoad();
    await testJpeg();
    status(`Fertig nach ${Math.round((performance.now() - t0) / 1000)} s. Bitte Bildschirmfotos von allen Ergebnissen schicken.`);
  } catch (e) {
    status('Abbruch, ' + e.name + ' ' + e.message);
  }
  btn.disabled = false;
  document.getElementById('copy').disabled = false;
};

document.getElementById('copy').onclick = async () => {
  const text = [...out.querySelectorAll('h2, .row')]
    .map(el => el.tagName === 'H2' ? '\n' + el.textContent : el.children[0].textContent + ': ' + el.children[1].textContent)
    .join('\n');
  try {
    await navigator.clipboard.writeText(text.trim());
    status('Ergebnis kopiert. Du kannst es jetzt in eine Nachricht einfügen.');
  } catch (e) {
    status('Kopieren fehlgeschlagen, bitte Bildschirmfotos machen.');
  }
};
</script>
</body>
</html>
