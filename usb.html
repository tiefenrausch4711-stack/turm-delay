<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LagLab USB-Test</title>
<style>
  :root { --bg:#111; --fg:#eee; --ok:#4d4; --warn:#fc3; --bad:#f66; --mut:#999; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.35 system-ui, sans-serif; padding:16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  h2 { font-size:19px; margin:14px 0 4px; padding-bottom:2px; border-bottom:1px solid #444; }
  button { font-size:20px; padding:12px 22px; margin:4px 8px 4px 0; border-radius:8px; border:0; background:#2a7; color:#fff; }
  button.sec { background:#345; }
  button:disabled { background:#555; }
  #status { font-size:18px; color:var(--warn); margin:8px 0; min-height:1.4em; }
  #verdict { font-size:20px; font-weight:600; margin:10px 0; padding:12px 14px; border-radius:8px; background:#1d2328; }
  #verdict:empty { display:none; }
  #preview { width:360px; max-width:100%; aspect-ratio:16/9; background:#000; margin:8px 0; display:block; }
  #out { columns:2 460px; column-gap:28px; }
  section { break-inside:avoid; }
  .row { display:flex; gap:10px; padding:1px 0; border-bottom:1px solid #222; }
  .k { flex:0 0 44%; color:#bbb; }
  .v { flex:1; word-break:break-word; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .mut { color:var(--mut); }
  #log { font:14px/1.4 ui-monospace, monospace; color:#bbb; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>LagLab USB-Test</h1>
<div>
  <button id="start">Test starten</button>
  <button id="usb" class="sec">USB-Geräte anzeigen</button>
  <button id="copy" class="sec" disabled>Ergebnis kopieren</button>
</div>
<div id="status">Webcam über den Hub anschließen, dann „Test starten“ tippen. Dauer etwa 30 Sekunden.</div>
<div id="verdict"></div>
<video id="preview" autoplay muted playsinline></video>
<div id="out"></div>
<h2>Ereignisse</h2>
<div id="log"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const out = $('out'), preview = $('preview');
let section = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = t => { $('status').textContent = t; };
const r1 = x => Math.round(x * 10) / 10;
const time = () => new Date().toLocaleTimeString('de-DE');
const log = t => { $('log').textContent = `${time()}  ${t}\n` + $('log').textContent; };

function sec(title) {
  section = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = title;
  section.append(h);
  out.append(section);
}

function row(k, v, cls = '') {
  const d = document.createElement('div');
  d.className = 'row';
  const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
  const b = document.createElement('span'); b.className = 'v ' + cls; b.textContent = v;
  d.append(a, b);
  section.append(d);
  return b;
}

function fmtCap(v) {
  if (Array.isArray(v)) return v.join(', ') || 'leer';
  if (v && typeof v === 'object' && 'max' in v) return `${r1(v.min)} bis ${r1(v.max)}`;
  return String(v);
}

// Chrome nennt eingebaute Kameras "camera2 0, facing back" oder "facing front"
const isBuiltin = d => /facing (back|front)/i.test(d.label);

async function cameras() {
  return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
}

function readTimeout(reader, ms) {
  return Promise.race([reader.read(), sleep(ms).then(() => null)]);
}

// Zählt die gelieferten Bilder anhand der Kamerazeitstempel
async function measureFps(track, ms) {
  if (!('MediaStreamTrackProcessor' in window)) return null;
  const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
  const warmupEnd = performance.now() + 500, end = warmupEnd + ms;
  let n = 0, t0 = null, tl = null;
  while (performance.now() < end) {
    const r = await readTimeout(reader, 2000);
    if (!r || r.done) break;
    const ts = r.value.timestamp;
    r.value.close();
    if (performance.now() < warmupEnd) continue;
    if (t0 === null) t0 = ts; else { n++; tl = ts; }
  }
  reader.cancel().catch(() => {});
  return tl === null ? 0 : n / ((tl - t0) / 1e6);
}

async function testBasics() {
  sec('Gerät');
  let chrome = navigator.userAgent.match(/Chrome\/([\d.]+)/)?.[1] || 'unbekannt';
  try {
    const hv = await navigator.userAgentData.getHighEntropyValues(['fullVersionList', 'model', 'platformVersion']);
    chrome = hv.fullVersionList.find(b => b.brand === 'Google Chrome' || b.brand === 'Chromium')?.version || chrome;
    row('Modell', hv.model || 'unbekannt');
    row('Android', hv.platformVersion || 'unbekannt');
  } catch (e) {}
  row('Chrome', chrome);
  row('WebUSB vorhanden', 'usb' in navigator ? 'ja' : 'nein', 'usb' in navigator ? 'ok' : 'mut');
}

// Fragt einmal die Kamerafreigabe an, erst danach nennt Chrome die Namen der Kameras
async function unlockLabels() {
  const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
  s.getTracks().forEach(t => t.stop());
  await sleep(300);
}

async function testList() {
  sec('Gefundene Kameras');
  const all = await cameras();
  if (!all.length) { row('Anzahl', '0', 'bad'); return all; }
  row('Anzahl', String(all.length));
  all.forEach((d, i) => row(`Kamera ${i + 1}`, `${d.label || 'ohne Namen'}${isBuiltin(d) ? ', eingebaut' : ', vermutlich extern'}`,
    isBuiltin(d) ? '' : 'ok'));
  return all;
}

async function testDevice(d, i) {
  sec(`Kamera ${i + 1}, ${isBuiltin(d) ? 'eingebaut' : 'extern'}`);
  row('Name', d.label || 'ohne Namen');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      deviceId: { exact: d.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } } });
  } catch (e) {
    row('Öffnen', 'fehlgeschlagen, ' + e.name + (e.message ? ', ' + e.message : ''), 'bad');
    return { ok: false };
  }
  row('Öffnen', 'ja', 'ok');
  preview.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  const st = track.getSettings();
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  row('Auflösung', `${st.width} × ${st.height}`, st.height >= 1080 ? 'ok' : 'warn');
  row('Blickrichtung', fmtCap(caps.facingMode ?? st.facingMode ?? 'nicht gemeldet'));
  for (const k of ['width', 'height', 'frameRate', 'zoom', 'focusMode', 'exposureMode', 'exposureCompensation']) {
    if (k in caps) row(k, fmtCap(caps[k]));
  }
  status(`Kamera ${i + 1}: Bildrate wird gemessen`);
  const fps = await measureFps(track, 3000);
  if (fps !== null) row('Bildrate gemessen', r1(fps) + ' B/s', fps >= 27 ? 'ok' : (fps >= 15 ? 'warn' : 'bad'));
  await sleep(500);
  stream.getTracks().forEach(t => t.stop());
  preview.srcObject = null;
  await sleep(400);
  return { ok: true, fps, h: st.height };
}

function verdict(all, results) {
  const v = $('verdict');
  const ext = all.map((d, i) => ({ d, r: results[i] })).filter(x => !isBuiltin(x.d));
  if (!ext.length) {
    v.className = 'bad';
    v.textContent = 'Keine externe Kamera gefunden. Chrome sieht nur die eingebauten Kameras. Mit „USB-Geräte anzeigen“ lässt sich prüfen, ob das Tablet die Webcam überhaupt am USB-Anschluss erkennt.';
    return;
  }
  const good = ext.find(x => x.r && x.r.ok);
  if (!good) {
    v.className = 'warn';
    v.textContent = 'Externe Kamera gefunden, sie lässt sich aber nicht öffnen.';
    return;
  }
  const { fps, h } = good.r;
  v.className = fps >= 27 && h >= 1080 ? 'ok' : 'warn';
  v.textContent = `Externe Kamera gefunden und nutzbar, ${h}p mit ${r1(fps || 0)} Bildern pro Sekunde.`;
}

$('start').onclick = async () => {
  const btn = $('start');
  btn.disabled = true;
  out.textContent = '';
  $('verdict').textContent = '';
  try {
    await testBasics();
    status('Kamerafreigabe wird angefragt');
    try { await unlockLabels(); }
    catch (e) { sec('Freigabe'); row('Kamerazugriff', 'fehlgeschlagen, ' + e.name, 'bad'); throw e; }
    const all = await testList();
    const results = [];
    for (let i = 0; i < all.length; i++) results.push(await testDevice(all[i], i));
    verdict(all, results);
    status('Fertig. Bitte „Ergebnis kopieren“ tippen und mir schicken, oder ein Bildschirmfoto machen.');
  } catch (e) {
    status('Abbruch, ' + e.name + ' ' + e.message);
  }
  btn.disabled = false;
  $('copy').disabled = false;
};

// Zeigt, ob das Tablet die Webcam am USB-Anschluss überhaupt sieht, unabhängig von der Kamerafunktion
$('usb').onclick = async () => {
  if (!('usb' in navigator)) { log('WebUSB fehlt in diesem Browser.'); return; }
  try {
    const dev = await navigator.usb.requestDevice({ filters: [] });
    log(`USB-Gerät gewählt: ${dev.manufacturerName || '?'} ${dev.productName || '?'}, Hersteller ${dev.vendorId.toString(16).padStart(4, '0')}, Produkt ${dev.productId.toString(16).padStart(4, '0')}`);
  } catch (e) {
    log(e.name === 'NotFoundError' ? 'Kein USB-Gerät gewählt oder keins gefunden.' : 'USB-Abfrage fehlgeschlagen, ' + e.name);
  }
};

// Meldet, wenn eine Kamera eingesteckt oder abgezogen wird
let known = null;
async function watch() {
  const now = await cameras();
  const names = now.map(d => d.label || d.deviceId.slice(0, 8) || 'ohne Namen');
  if (known) {
    for (const n of names) if (!known.includes(n)) log('Kamera dazugekommen: ' + n);
    for (const n of known) if (!names.includes(n)) log('Kamera entfernt: ' + n);
  }
  known = names;
}
navigator.mediaDevices.addEventListener('devicechange', watch);
watch();
log('Seite geöffnet. Ein- und Ausstecken der Webcam wird hier gemeldet.');

$('copy').onclick = async () => {
  const text = [$('verdict').textContent, ...[...out.querySelectorAll('h2, .row')]
    .map(el => el.tagName === 'H2' ? '\n' + el.textContent : el.children[0].textContent + ': ' + el.children[1].textContent),
    '\nEreignisse', $('log').textContent].join('\n');
  try {
    await navigator.clipboard.writeText(text.trim());
    status('Ergebnis kopiert. Sie können es jetzt in eine Nachricht einfügen.');
  } catch (e) {
    status('Kopieren fehlgeschlagen, bitte ein Bildschirmfoto machen.');
  }
};
</script>
</body>
</html>
